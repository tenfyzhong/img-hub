name: Reset administrator password

run-name: Reset administrator password in ${{ inputs.database_name }}

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: Exact deployed D1 database name
        required: true
        type: string
      confirm_reset:
        description: Revoke administrator sessions and API keys, and require a password change
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate reset request
        env:
          CONFIRM_RESET: ${{ inputs.confirm_reset }}
          DATABASE_NAME: ${{ inputs.database_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMG_HUB_NEW_ADMIN_PASSWORD: ${{ secrets.IMG_HUB_ADMIN_RESET_PASSWORD }}
        run: |
          if [[ "$CONFIRM_RESET" != "true" ]]; then
            echo "Administrator password reset was not confirmed."
            exit 1
          fi
          if [[ ! "$DATABASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Enter the exact valid D1 database name."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          if [[ -z "$IMG_HUB_NEW_ADMIN_PASSWORD" ]]; then
            echo "Add the temporary IMG_HUB_ADMIN_RESET_PASSWORD repository secret."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reset administrator credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMG_HUB_NEW_ADMIN_PASSWORD: ${{ secrets.IMG_HUB_ADMIN_RESET_PASSWORD }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: npm run admin:reset -- --remote --database "$DATABASE_NAME"
