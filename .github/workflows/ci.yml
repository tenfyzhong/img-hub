name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  merge_group:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Keep main limited to releases and hotfixes
        shell: bash
        run: |
          if [[ "$GITHUB_BASE_REF" != "main" ]]; then
            exit 0
          fi
          case "$GITHUB_HEAD_REF" in
            develop|release/*|hotfix/*)
              ;;
            *)
              echo "Pull requests to main must come from develop, release/*, or hotfix/*."
              echo "Retarget feature and fix pull requests to develop."
              exit 1
              ;;
          esac

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:local
      - run: npm run check:deploy
      - run: npm run build:extension
      - run: git diff --check
