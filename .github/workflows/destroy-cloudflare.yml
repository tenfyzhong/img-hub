name: "DESTRUCTIVE: Destroy Cloudflare deployment"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "DESTRUCTIVE: type owner/repository exactly"
        required: true
        type: string
      confirmation:
        description: "IRREVERSIBLE: type DESTROY owner/repository exactly"
        required: true
        type: string
      confirm_data_loss:
        description: "I understand that the Worker, every R2 object, R2 bucket, D1 database, and Turnstile widget will be permanently deleted"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  destroy:
    name: "IRREVERSIBLE Cloudflare destruction"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate destructive confirmation
        env:
          CONFIRM_REPOSITORY: ${{ inputs.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CONFIRM_DATA_LOSS: ${{ inputs.confirm_data_loss }}
        run: |
          set -euo pipefail
          expected="DESTROY $GITHUB_REPOSITORY"
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing to run destructive code from any branch other than main." >&2
            exit 1
          fi
          if [[ "$CONFIRM_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "Repository confirmation does not match exactly; destruction refused." >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo "Destruction phrase does not match exactly; destruction refused." >&2
            exit 1
          fi
          if [[ "$CONFIRM_DATA_LOSS" != "true" ]]; then
            echo "Permanent data-loss acknowledgement is required; destruction refused." >&2
            exit 1
          fi
          {
            echo "## ⚠️ IRREVERSIBLE DESTRUCTION"
            echo
            echo "This run will permanently delete the repository's named Worker, every R2 object and its bucket, the D1 database, and the managed Turnstile widget. No backup is created."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be configured." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "DESTROY Worker, R2, D1, and Turnstile"
        run: npm run destroy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMG_HUB_RESOURCE_PREFIX: ${{ vars.IMG_HUB_RESOURCE_PREFIX || format('img-hub-{0}', github.event.repository.id) }}
          IMG_HUB_DESTROY_EXPECTED_REPOSITORY: ${{ github.repository }}
          IMG_HUB_DESTROY_REPOSITORY: ${{ inputs.repository }}
          IMG_HUB_DESTROY_CONFIRMATION: ${{ inputs.confirmation }}
          IMG_HUB_DESTROY_CONFIRMED: ${{ inputs.confirm_data_loss }}
